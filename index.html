<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="google-site-verification" content="MAJhaADwCtT-neZKAuk_CvCzFJ1w0pTSV_bGjtUF-vE" />
<title>WinTrek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/main.ico.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <!-- Program Manager style frame -->
    <div id="frame">
      <div id="menubar">
        <span class="menu" data-menu="file">File</span>
        <span class="menu" data-menu="skill">Skill</span>
        <span class="menu" data-menu="options">Options</span>
        <span class="menu" data-menu="window">Window</span>
        <span class="menu" data-menu="help">Help</span>
        <span id="frame-title">WinTrek</span>
      </div>
      <div id="client">
        <div id="desk"></div>
        <!-- MDI child windows are created here by ui.js -->
        <div id="iconbar"></div>
      </div>
    </div>
  </div>
</div>

<!-- dropdown menus -->
<div id="dropdown" class="hidden"></div>

<!-- modal overlays (StarFleet memo / scores / about / pause / dialogs) -->
<div id="modal" class="hidden"><div id="modal-box"></div></div>

<!-- hidden input for mobile text entry into the Computer window -->
<input id="com-input" autocomplete="off" autocapitalize="characters" spellcheck="false">

<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () =>
  navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
